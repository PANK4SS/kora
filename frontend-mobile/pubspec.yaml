name: kora_mobile
description: "Plateforme de centralisation et de transmission des ressources académiques"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.5
  dio: ^5.4.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.5
  open_filex: ^4.7.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

#Configuration de l'app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png


#Configuration du splash
flutter_native_splash:
  color: "#C58B2B"
  image: assets/icons/splash_logo_badge.png
  
  #Configuration Android
  android: true
  android_12:
    image: assets/icons/splash_logo_badge.png
    color: "#C58B2B"
    icon_background_color: "#FFFFFF"

  #Configuration ios
  ios: true


flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
